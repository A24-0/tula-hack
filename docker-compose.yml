services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - uploads:/uploads
    environment:
      UPLOAD_DIR: /uploads
      PROCESSOR_URL: http://ai-service:8000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      ai-service:
        condition: service_healthy

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - uploads:/uploads
      - whisper_models:/models
    environment:
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      GIGACHAT_API_KEY: ${GIGACHAT_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  uploads:
  whisper_models:

networks:
  default:
    name: tula-hack-net
