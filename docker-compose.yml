services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    volumes:
      - uploads:/uploads
    environment:
      UPLOAD_DIR: /uploads
      PROCESSOR_URL: http://ai-service:8000

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  uploads:
